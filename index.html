<div id="root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============== CONFIGURACIÓN SUPABASE ============== */
const SUPABASE_URL = "https://miyiqasxcvnnzoyumzqd.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_2k9VMCy53CwqNhGancX-Yg_n4xPkyfc";
const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const URL_CREAR_USUARIO = "https://round-wood-6533.lautibagnato.workers.dev";

const root = document.getElementById('root');
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const fmt = n => new Intl.NumberFormat('es-AR', { maximumFractionDigits: 0 }).format(n || 0);
// Convierte una fecha en formato YYYY-MM-DD (como la guarda la base) a DD/MM/AAAA para mostrar en pantalla
const fmtFecha = iso => {
  if (!iso) return '';
  const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return iso;
  return `${m[3]}/${m[2]}/${m[1]}`;
};
// Convierte un timestamp (creado_en de un reporte) a DD/MM/AAAA HH:MM para mostrar en pantalla
const fmtFechaHora = iso => {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return String(iso);
  const dd = String(d.getDate()).padStart(2, '0');
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const hh = String(d.getHours()).padStart(2, '0');
  const mi = String(d.getMinutes()).padStart(2, '0');
  return `${dd}/${mm}/${d.getFullYear()} ${hh}:${mi}`;
};

let D = null;       // datos ya transformados (mismo formato que usaba data.js)
let perfil = null;  // { id, nombre_completo, rol, dupla_asignada }
let reportesCache = null; // { rows } o { error } — se carga bajo demanda al entrar a la vista Reportes
let misReportesCache = null; // ídem, para la vista "Mis reportes" (filtrada a los propios)
let usuariosCache = null; // { rows } o { error } — lista de usuarios existentes, para editar nombre/rol/dupla
let perfilesCache = null; // { rows } o { error } — usuarios con dupla, para que admin/jefe elijan de quién ver el Perfil

// Realtime: canal activo de cada vista + cuál de las dos tiene la suscripción viva (o null)
let canalReportesAdmin = null;
let canalMisReportes = null;
let vistaConSuscripcion = null;

// Corta la suscripción realtime activa, sea cual sea. Se llama desde render() al cambiar de vista, y desde el logout.
function desuscribirReportes() {
  if (vistaConSuscripcion === 'reportes' && canalReportesAdmin) { supa.removeChannel(canalReportesAdmin); canalReportesAdmin = null; }
  if (vistaConSuscripcion === 'mis-reportes' && canalMisReportes) { supa.removeChannel(canalMisReportes); canalMisReportes = null; }
  vistaConSuscripcion = null;
}
let state = { view: 'dashboard', org: 'TODOS', pasSel: 'TODOS', q: '', pas: null, pagina: 1, trimFicha: 'TODOS', chartCompania: null, chartRamo: null, chartEvo: 'TOTAL', cmpDim: 'ZONA', cmpSel: [], cmpDesglose: null, perfilObjetivoId: null };

/* ============== PANTALLA DE CARGA ============== */
function renderLoading(msg) {
  root.innerHTML = `<div class="loading">${esc(msg || 'Cargando...')}</div>`;
}

/* ============== PANTALLA DE LOGIN ============== */
function renderLogin(errorMsg) {
  root.innerHTML = `
    <div class="loginwrap">
      <div class="loginbox">
        <h1>AB Gestión</h1>
        <p>Ingresá con tu usuario para continuar</p>
        <form id="login-form">
          <label>Usuario</label>
          <input type="email" id="login-email" placeholder="tuusuario@abgestion.sistema" required>
          <label>Contraseña</label>
          <input type="password" id="login-pass" required>
          ${errorMsg ? `<div class="loginerr">${esc(errorMsg)}</div>` : ''}
          <button type="submit" id="login-btn">Ingresar</button>
        </form>
      </div>
    </div>`;
  document.getElementById('login-form').onsubmit = async (e) => {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    btn.disabled = true; btn.textContent = 'Ingresando...';
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-pass').value;
    const { error } = await supa.auth.signInWithPassword({ email, password });
    if (error) {
      renderLogin('Usuario o contraseña incorrectos.');
      return;
    }
    await iniciarApp();
  };
}

/* ============== CARGA DE PERFIL (rol / dupla) ============== */
async function cargarPerfil() {
  const { data: { user } } = await supa.auth.getUser();
  if (!user) return null;
  const { data, error } = await supa.from('usuarios').select('*').eq('id', user.id).single();
  if (error || !data) return null;
  return data;
}

/* ============== CARGA Y TRANSFORMACIÓN DE DATOS ============== */
// Supabase corta select('*') en 1000 filas por defecto: esto pagina hasta traer todo.
const PAGE_SIZE = 1000;
async function fetchAllRows(tabla) {
  let filas = [];
  let desde = 0;
  while (true) {
    const { data, error } = await supa.from(tabla).select('*').range(desde, desde + PAGE_SIZE - 1);
    if (error) return { data: null, error };
    filas = filas.concat(data || []);
    if (!data || data.length < PAGE_SIZE) break;
    desde += PAGE_SIZE;
  }
  return { data: filas, error: null };
}

async function cargarDatos() {
  const [{ data: productoresRows, error: e1 }, { data: produccionesRows, error: e2 },
         { data: detalleRows, error: e3 }, { data: catalogoRows, error: e4 }] = await Promise.all([
    fetchAllRows('productores'),
    fetchAllRows('producciones'),
    fetchAllRows('produccion_companias'),
    fetchAllRows('catalogos'),
  ]);
  if (e1 || e2 || e3 || e4) {
    console.error(e1, e2, e3, e4);
    throw new Error('No se pudieron cargar los datos desde Supabase.');
  }

  const pasIdToNombre = {};
  const producers = (productoresRows || []).map(r => {
    pasIdToNombre[r.id] = r.pas_nombre;
    return {
      _id: r.id,
      'ORGANIZACIÓN': r.organizacion,
      'PAS': r.pas_nombre,
      'VINCULANTE': r.vinculante,
      'EJECUTIVO': r.ejecutivo,
      'TELÉFONO': r.telefono,
      'MAIL': r.mail,
      'FECHA DE NACIMIENTO': r.fecha_nacimiento,
      'COMPAÑÍAS CON LAS QUE OPERA': r.companias_opera,
      'CANTIDAD DE PÓLIZAS VIGENTES': r.cantidad_polizas_vigentes,
      'OBSERVACIONES': r.observaciones,
      'ESTADO': r.estado,
      'ZONA': r.zona,
      'LOCALIDAD/PROV': r.localidad_prov,
    };
  });

  const companiasPorProduccion = {};
  (detalleRows || []).forEach(d => {
    if (!companiasPorProduccion[d.produccion_id]) companiasPorProduccion[d.produccion_id] = {};
    companiasPorProduccion[d.produccion_id][d.compania] = (companiasPorProduccion[d.produccion_id][d.compania] || 0) + (+d.cantidad || 0);
  });

  const production = (produccionesRows || []).map(r => ({
    _id: r.id,
    _pas_id: r.pas_id,
    'PAS': pasIdToNombre[r.pas_id] || '(desconocido)',
    'RAMO': r.ramo,
    'TRIMESTRE': r.trimestre,
    'EJECUTIVO': r.ejecutivo,
    'ORGANIZADOR': r.organizador,
    'TOTAL': r.total_polizas,
    'FECHA': r.ultima_fecha,
    'COMPANIAS': companiasPorProduccion[r.id] || {},
  }));

  const porTipo = t => [...new Set((catalogoRows || []).filter(c => c.tipo === t && c.activo !== false).map(c => c.valor))];
  const catalog = {
    ejecutivos: porTipo('ejecutivo'),
    organizaciones: porTipo('organizacion'),
    companias: porTipo('compania'),
    vinculantes: porTipo('vinculante'),
    ramos: porTipo('ramo'),
    trimestres: porTipo('trimestre'),
    estados: porTipo('estado'),
    zonas: porTipo('zona'),
    localidades: porTipo('localidad_prov'),
  };

  return { producers, production, catalog };
}

/* ============== ARRANQUE DE LA APP ============== */
async function iniciarApp() {
  renderLoading('Verificando usuario...');
  perfil = await cargarPerfil();
  if (!perfil) {
    await supa.auth.signOut();
    renderLogin('Tu usuario no tiene un perfil asignado. Contactá al administrador.');
    return;
  }
  renderLoading('Cargando datos...');
  try {
    D = await cargarDatos();
  } catch (err) {
    root.innerHTML = `<div class="loading">Error cargando datos: ${esc(err.message)}</div>`;
    return;
  }
  renderShell();
}

function renderShell() {
  root.innerHTML = `
    <div class="app">
      <aside class="side">
        <div class="brand" id="brand-home" style="cursor:pointer">AB Gestión</div>
        <div class="brand-logo"><img src="logo.png" alt="Grupo Alonso+Bernardi"></div>
        <nav class="nav">
          <button data-view="dashboard">${ICONO_GRID} <span>Dashboard</span></button>
          <button data-view="productores">${ICONO_PERSONA} <span>Productores</span></button>
          <button data-view="comparar">${ICONO_INTERCAMBIO} <span>Comparar</span></button>
          <button data-view="mis-reportes">${ICONO_CAMPANA} <span>Mis reportes</span></button>
          ${perfil.rol === 'admin' ? `<button data-view="reportes">${ICONO_SOBRE} <span>Reportes</span></button><button data-view="usuarios">${ICONO_PERSONAS} <span>Usuarios</span></button>` : ''}
        </nav>
        <div class="nav" style="flex:none">
          <button data-view="perfil">${ICONO_TARJETA} <span>Perfil</span></button>
        </div>
        <div class="userbox">
          <b>${esc(perfil.nombre_completo || 'Usuario')}</b>
          <span class="rolpill">${esc(((ROLES_USUARIO.find(r => r.valor === perfil.rol) || {}).etiqueta || perfil.rol || '').toUpperCase())}</span>
          ${perfil.dupla_asignada ? `<div style="margin-top:6px">${esc(perfil.dupla_asignada)}</div>` : ''}
          <button class="logout" id="btn-reportar" style="margin-bottom:8px;display:flex;align-items:center;justify-content:center;gap:8px">${ICONO_CHAT} Reportar algo</button>
          <button class="logout" id="btn-logout">Cerrar sesión</button>
        </div>
      </aside>
      <main class="main"><div id="app"></div></main>
    </div>
    <div id="modal-overlay" class="modal-overlay" onclick="if(event.target===this) cerrarModal()"></div>`;
  document.getElementById('btn-logout').onclick = async () => {
    desuscribirReportes();
    await supa.auth.signOut();
    D = null; perfil = null;
    renderLogin();
  };
  document.getElementById('btn-reportar').onclick = () => abrirFormReporte();
  document.querySelectorAll('.nav button').forEach(b => b.onclick = () => {
    state.view = b.dataset.view;
    state.pas = null;
    if (b.dataset.view === 'reportes') reportesCache = null;
    if (b.dataset.view === 'mis-reportes') misReportesCache = null;
    if (b.dataset.view === 'usuarios') usuariosCache = null;
    if (b.dataset.view === 'perfil') perfilesCache = null;
    render();
  });
  document.getElementById('brand-home').onclick = () => { state.view = 'dashboard'; state.pas = null; render(); };
  render();
}

/* ============== PERMISOS ============== */
// Datos del PAS (nombre, organización, zona, etc.): admin, editor y carga_pas (solo su propia dupla)
function puedeEditarDatosPas(p) {
  if (!perfil) return false;
  if (perfil.rol === 'admin') return true;
  if (perfil.rol === 'editor' || perfil.rol === 'carga_pas') return p && p.EJECUTIVO === perfil.dupla_asignada;
  return false;
}
// Producción (cargas de pólizas): admin y editor únicamente (carga_pas NO toca producción)
function puedeCargarProduccion(p) {
  if (!perfil) return false;
  if (perfil.rol === 'admin') return true;
  if (perfil.rol === 'editor') return p && p.EJECUTIVO === perfil.dupla_asignada;
  return false;
}
function puedeCrearPas() {
  return perfil && (perfil.rol === 'admin' || perfil.rol === 'editor' || perfil.rol === 'carga_pas');
}
// Borrar un PAS entero pasa por el RPC eliminar_pas, que solo contempla admin/editor — carga_pas no borra nada
function puedeEliminarPas(p) {
  if (!perfil) return false;
  if (perfil.rol === 'admin') return true;
  if (perfil.rol === 'editor') return p && p.EJECUTIVO === perfil.dupla_asignada;
  return false;
}

/* ============== MODAL ============== */
function abrirModal(html) {
  const overlay = document.getElementById('modal-overlay');
  overlay.innerHTML = `<div class="modal-box">${html}</div>`;
  overlay.style.display = 'flex';
}
function cerrarModal() {
  const overlay = document.getElementById('modal-overlay');
  overlay.style.display = 'none';

// Arma la lista con checkbox de todas las compañías del catálogo, tildando las que el PAS ya tenía cargadas
function poblarChecklistCompanias(valorExistente) {
  const yaTenia = valorExistente.split(/[,\-\/]+/).map(s => s.trim().toUpperCase()).filter(Boolean);

async function guardarEdicionProduccion(prod) {
  const btn = document.getElementById('btn-guardar-prod');
  const msg = document.getElementById('form-prod-msg');
  msg.innerHTML = '';

  const ramo = document.getElementById('f-ramo').value;
  const trimestre = document.getElementById('f-trim').value;
  const organizador = document.getElementById('f-organizador').value.trim();
  const fecha = document.getElementById('f-fecha').value || null;
  if (ramo === 'TODOS' || trimestre === 'TODOS') { msg.innerHTML = '<div class="formerr">Elegí ramo y trimestre.</div>'; return; }

  const filas = Array.from(document.querySelectorAll('#filas-compania .companiarow'));
  const detalle = [];
  for (const fila of filas) {
    const id = fila.id.replace('fila-comp-', '');
    const comp = document.getElementById(`fc-comp-${id}`).value;
    const cant = parseInt(document.getElementById(`fc-cant-${id}`).value, 10);
    if (comp !== 'TODOS' && cant > 0) detalle.push({ compania: comp, cantidad: cant });
  }
  if (detalle.length === 0) { msg.innerHTML = '<div class="formerr">Agregá al menos una compañía con cantidad mayor a 0.</div>'; return; }

  const total = detalle.reduce((s, d) => s + d.cantidad, 0);

  btn.disabled = true; btn.textContent = 'Guardando...';
  const { error: errProd } = await supa.from('producciones').update({
    ramo, trimestre, organizador, total_polizas: total, ultima_fecha: fecha,
  }).eq('id', prod._id);

  if (errProd) {
    btn.disabled = false; btn.textContent = 'Guardar cambios';
    msg.innerHTML = `<div class="formerr">No se pudo guardar: ${esc(errProd.message)}</div>`;
    return;
  }

  const { error: errBorrar } = await supa.from('produccion_companias').delete().eq('produccion_id', prod._id);
  if (errBorrar) {
    btn.disabled = false; btn.textContent = 'Guardar cambios';
    msg.innerHTML = `<div class="formerr">No se pudo actualizar el detalle de compañías: ${esc(errBorrar.message)}</div>`;
    return;
  }

  const filasDetalle = detalle.map(d => ({ produccion_id: prod._id, compania: d.compania, cantidad: d.cantidad }));
  const { error: errDet } = await supa.from('produccion_companias').insert(filasDetalle);

  btn.disabled = false; btn.textContent = 'Guardar cambios';
  if (errDet) {
    msg.innerHTML = `<div class="formerr">Se actualizó la carga pero hubo un error con el detalle de compañías: ${esc(errDet.message)}</div>`;
    return;
  }
  msg.innerHTML = '<div class="formok">Cambios guardados correctamente.</div>';
  D = await cargarDatos();
  setTimeout(() => { cerrarModal(); render(); }, 600);
}

function opts(arr, val) { return '<option value="TODOS">TODOS</option>' + arr.filter(Boolean).map(x => '<option value="' + esc(x) + '" ' + (x === val ? 'selected' : '') + '>' + esc(x) + '</option>').join('') }

// Convierte un trimestre (ej. "T1 2026") en un número ordenable cronológicamente (año*10 + numero de trimestre)
function trimestreOrden(t) {
  const m = String(t).match(/T(\d)\D+(\d{4})/i);
  if (!m) return 0;
  return parseInt(m[2], 10) * 10 + parseInt(m[1], 10);
}

// Gráfico de líneas armado a mano en SVG (no hay librería de gráficos en el proyecto)
function svgLineChart(labels, values) {
  const w = 560, h = 180, pad = 32;
  if (!labels.length || values.every(v => !v)) {
    return '<div class="empty">Sin datos para mostrar</div>';
  }
  const max = Math.max(...values, 1);
  const stepX = labels.length > 1 ? (w - 2 * pad) / (labels.length - 1) : 0;
  const points = values.map((v, i) => ({
    x: pad + i * stepX,
    y: h - pad - (v / max) * (h - 2 * pad),
    v
  }));
  const path = points.map((p, i) => (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ');
  const circles = points.map(p =>
    `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.5" fill="var(--accent)"></circle>` +
    `<text x="${p.x.toFixed(1)}" y="${(p.y - 8).toFixed(1)}" font-size="11" text-anchor="middle" fill="var(--ink)">${fmt(p.v)}</text>`
  ).join('');
  const xlabels = labels.map((l, i) =>
    `<text x="${(pad + i * stepX).toFixed(1)}" y="${h - 8}" font-size="10" text-anchor="middle" fill="var(--muted)">${esc(l)}</text>`
  ).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px" preserveAspectRatio="xMidYMid meet">
    <line x1="${pad}" y1="${h - pad}" x2="${w - pad}" y2="${h - pad}" stroke="var(--line)"></line>
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5"></path>
    ${circles}${xlabels}
  </svg>`;
}

function itemsParaDimension(dim) {
  if (dim === 'ZONA') return [...D.catalog.zonas].sort((a, b) => a.localeCompare(b, 'es'));
  if (dim === 'PAS') return D.producers.map(p => p.PAS).filter(Boolean).sort((a, b) => a.localeCompare(b, 'es'));
  if (dim === 'ORGANIZACION') return [...D.catalog.organizaciones].sort((a, b) => a.localeCompare(b, 'es'));
  if (dim === 'EJECUTIVO') return [...D.catalog.ejecutivos].sort((a, b) => a.localeCompare(b, 'es'));
  if (dim === 'COMPANIA') return [...D.catalog.companias].sort((a, b) => a.localeCompare(b, 'es'));
  if (dim === 'RAMO') return [...D.catalog.ramos].sort((a, b) => a.localeCompare(b, 'es'));
  return [];
}

// Serie de producción por trimestre para un elemento puntual de una dimensión (siempre sobre TODA la base)
function serieComparar(dim, valor, trimestres) {
  if (dim === 'COMPANIA') {
    return trimestres.map(t => D.production.filter(x => x.TRIMESTRE === t).reduce((s, x) => s + (x.COMPANIAS[valor] || 0), 0));
  }
  if (dim === 'ZONA') {
    const pasesEnZona = new Set(D.producers.filter(p => p.ZONA === valor).map(p => p.PAS));
    return trimestres.map(t => D.production.filter(x => x.TRIMESTRE === t && pasesEnZona.has(x.PAS)).reduce((s, x) => s + (x.TOTAL || 0), 0));
  }
  const campo = dim === 'PAS' ? 'PAS' : dim === 'ORGANIZACION' ? 'ORGANIZADOR' : dim === 'EJECUTIVO' ? 'EJECUTIVO' : 'RAMO';
  return trimestres.map(t => D.production.filter(x => x.TRIMESTRE === t && x[campo] === valor).reduce((s, x) => s + (x.TOTAL || 0), 0));
}

// Todas las filas de producción que corresponden a un elemento puntual de una dimensión (todo el histórico)
function filasParaDimension(dim, valor) {
  if (dim === 'COMPANIA') return D.production.filter(x => (x.COMPANIAS[valor] || 0) > 0);
  if (dim === 'ZONA') {
    const pasesEnZona = new Set(D.producers.filter(p => p.ZONA === valor).map(p => p.PAS));
    return D.production.filter(x => pasesEnZona.has(x.PAS));
  }
  const campo = dim === 'PAS' ? 'PAS' : dim === 'ORGANIZACION' ? 'ORGANIZADOR' : dim === 'EJECUTIVO' ? 'EJECUTIVO' : 'RAMO';
  return D.production.filter(x => x[campo] === valor);
}

// Ranking (top 8) de un campo simple (PAS, RAMO, ORGANIZADOR) dentro de un conjunto de filas
function rankingPorCampo(filas, campo, top = 8) {
  const acc = {};
  filas.forEach(x => { const k = x[campo]; if (k) acc[k] = (acc[k] || 0) + (x.TOTAL || 0); });
  return Object.entries(acc).sort((a, b) => b[1] - a[1]).slice(0, top);
}

// Ranking (top 8) de compañías dentro de un conjunto de filas (la cantidad está en x.COMPANIAS, no en un campo directo)
function rankingCompanias(filas, top = 8) {
  const acc = {};
  filas.forEach(x => Object.entries(x.COMPANIAS).forEach(([c, v]) => { acc[c] = (acc[c] || 0) + v; }));
  return Object.entries(acc).sort((a, b) => b[1] - a[1]).slice(0, top);
}

function rankingParaTipo(tipo, filas) {
  if (tipo === 'PAS') return rankingPorCampo(filas, 'PAS');
  if (tipo === 'RAMO') return rankingPorCampo(filas, 'RAMO');
  if (tipo === 'COMPANIA') return rankingCompanias(filas);
  if (tipo === 'ORGANIZACION') return rankingPorCampo(filas, 'ORGANIZADOR');
  return [];
}

// no verificados al pixel — avisen si alguno no corresponde y se ajusta). Para el resto, se genera
// un color estable a partir del nombre, así siempre le toca el mismo color a la misma compañía.
const COLOR_COMPANIA = {
  'SANCOR': '#00833E', 'SANCOR SEGUROS': '#00833E',
  'PROVINCIA': '#2E7D32', 'PROVINCIA SEGUROS': '#2E7D32',

  'GALENO': '#8DC63F',
  'EXPERTA': '#6A1B9A', 'EXPERTA SEGUROS': '#6A1B9A',
  'RUS': '#004C97', 'RIO URUGUAY SEGUROS': '#004C97', 'RÍO URUGUAY SEGUROS': '#004C97',
  'SAN CRISTOBAL': '#1565C0', 'SAN CRISTÓBAL': '#1565C0',

};
const PALETA_FALLBACK_COMPANIA = ['#1B8763', '#1B3A5C', '#2D6CA6', '#C1613F', '#5FA98A', '#125F46', '#4E86B8'];
function colorParaCompania(nombre) {
  const clave = String(nombre || '').toUpperCase().trim();
  if (COLOR_COMPANIA[clave]) return COLOR_COMPANIA[clave];
  let hash = 0;
  for (let i = 0; i < clave.length; i++) hash = (hash * 31 + clave.charCodeAt(i)) >>> 0;
  return PALETA_FALLBACK_COMPANIA[hash % PALETA_FALLBACK_COMPANIA.length];
}

// Gráfico de barras horizontales apiladas: una fila por ramo, coloreada por compañía
function svgBarrasRamoCompania(ramoCompaniaMatrix, ramosOrdenados) {
  const filaAltura = 32, pad = 8, anchoBarra = 460, xBarra = 150, w = 700;
  const h = ramosOrdenados.length * filaAltura + pad * 2;
  if (!ramosOrdenados.length) return '<div class="empty">Sin datos para mostrar</div>';
  const maxRamoTotal = Math.max(...ramosOrdenados.map(r => Object.values(ramoCompaniaMatrix[r] || {}).reduce((s, v) => s + v, 0)), 1);

  const filas = ramosOrdenados.map((ramo, i) => {
    const y = pad + i * filaAltura;
    const companias = Object.entries(ramoCompaniaMatrix[ramo] || {}).sort((a, b) => b[1] - a[1]);
    const totalRamo = companias.reduce((s, [, v]) => s + v, 0);
    let x = xBarra;
    const segmentos = companias.map(([comp, valor]) => {
      const ancho = Math.max((valor / maxRamoTotal) * anchoBarra, 1);
      const seg = `<rect x="${x.toFixed(1)}" y="${y}" width="${ancho.toFixed(1)}" height="${filaAltura - 10}" fill="${colorParaCompania(comp)}" rx="2"><title>${esc(ramo)} · ${esc(comp)}: ${fmt(valor)}</title></rect>`;
      x += ancho;
      return seg;
    }).join('');
    const yTexto = y + (filaAltura - 10) / 2 + 4;
    return `<text x="0" y="${yTexto}" font-size="11" fill="var(--ink)">${esc(ramo)}</text>${segmentos}<text x="${(x + 6).toFixed(1)}" y="${yTexto}" font-size="11" fill="var(--muted)">${fmt(totalRamo)}</text>`;
  }).join('');

  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px">${filas}</svg>`;
}

// Gráfico de líneas múltiples (una serie por elemento comparado) + leyenda, mismo criterio SVG a mano que svgLineChart
function svgMultiLineChart(labels, series) {
  const w = 680, h = 260, pad = 36;
  if (!labels.length || !series.length || series.every(s => s.valores.every(v => !v))) {
    return '<div class="empty">Sin datos para mostrar</div>';
  }
  const max = Math.max(...series.flatMap(s => s.valores), 1);
  const stepX = labels.length > 1 ? (w - 2 * pad) / (labels.length - 1) : 0;
  const lineas = series.map((s, si) => {
    const color = PALETA_COMPARAR[si % PALETA_COMPARAR.length];
    const points = s.valores.map((v, i) => ({ x: pad + i * stepX, y: h - pad - (v / max) * (h - 2 * pad), v }));
    const path = points.map((p, i) => (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ');
    const circles = points.map(p =>
      `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.5" fill="${color}"><title>${esc(s.label)}: ${fmt(p.v)}</title></circle>`
    ).join('');
    return `<path d="${path}" fill="none" stroke="${color}" stroke-width="2.5"></path>${circles}`;
  }).join('');
  const xlabels = labels.map((l, i) =>
    `<text x="${(pad + i * stepX).toFixed(1)}" y="${h - 8}" font-size="10" text-anchor="middle" fill="var(--muted)">${esc(l)}</text>`
  ).join('');
  const leyenda = series.map((s, si) =>
    `<span style="display:inline-flex;align-items:center;gap:6px;margin:4px 14px 4px 0;font-size:12px"><span style="width:10px;height:10px;border-radius:50%;background:${PALETA_COMPARAR[si % PALETA_COMPARAR.length]};display:inline-block"></span>${esc(s.label)}</span>`
  ).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px" preserveAspectRatio="xMidYMid meet">
    <line x1="${pad}" y1="${h - pad}" x2="${w - pad}" y2="${h - pad}" stroke="var(--line)"></line>
    ${lineas}${xlabels}
  </svg><div style="margin-top:8px">${leyenda}</div>`;
}

function render() {
  // Guardamos que elemento tenia el foco (y la posicion del cursor si era un input de texto) antes de redibujar
  const activo = document.activeElement;
  const activoId = activo && activo.id;
  const cursorPos = (activo && typeof activo.selectionStart === 'number') ? activo.selectionStart : null;

  // Si nos estamos yendo de una vista con suscripción realtime activa, la cortamos antes de dibujar la nueva
  if (vistaConSuscripcion && vistaConSuscripcion !== state.view) desuscribirReportes();

  nav();
  if (state.view === 'dashboard') dashboard(); else if (state.view === 'productores') productores(); else if (state.view === 'comparar') comparar(); else if (state.view === 'reportes') vistaReportes(); else if (state.view === 'mis-reportes') vistaMisReportes(); else if (state.view === 'usuarios') vistaUsuarios(); else if (state.view === 'perfil') vistaPerfil(); else ficha(state.pas);

  // Le devolvemos el foco al elemento que lo tenia (ahora es un elemento nuevo, pero con el mismo id)
  if (activoId) {
    const nuevo = document.getElementById(activoId);
    if (nuevo) {
      nuevo.focus();
      if (cursorPos !== null && typeof nuevo.setSelectionRange === 'function') {
        try { nuevo.setSelectionRange(cursorPos, cursorPos) } catch (e) {}
      }
    }
  }
}

function productores() {

  state.pagina = 1;
  const botonNuevo = puedeCrearPas() ? `<button class="btn-primary" id="btn-nuevo-pas">+ Nuevo PAS</button>` : '';
  $('#app').innerHTML = `<div class="top"><div><h1>Productores</h1><div class="sub" id="prod-sub">Base de PAS</div></div><div style="display:flex;gap:10px;align-items:center"><input class="search" id="search" placeholder="Buscar PAS, organización, ejecutivo..." value="${esc(state.q)}">${botonNuevo}</div></div><div class="card"><div id="prod-tabla"></div></div>`;
  $('#search').oninput = e => { state.q = e.target.value; state.pagina = 1; renderTablaProductores() };
  if (puedeCrearPas()) document.getElementById('btn-nuevo-pas').onclick = () => abrirFormPAS(null);
  renderTablaProductores();
}

function renderTablaProductores() {
  let list = D.producers.filter(p => Object.values(p).join(' ').toLowerCase().includes(state.q.toLowerCase()));
  list = list.slice().sort((a, b) => (a.PAS || '').localeCompare(b.PAS || '', 'es'));

  const totalPaginas = Math.max(1, Math.ceil(list.length / FILAS_POR_PAGINA));
  if (state.pagina > totalPaginas) state.pagina = totalPaginas;
  if (state.pagina < 1) state.pagina = 1;
  const desde = (state.pagina - 1) * FILAS_POR_PAGINA;
  const pagina = list.slice(desde, desde + FILAS_POR_PAGINA);

  $('#prod-sub').textContent = `Base de PAS · ${fmt(list.length)} resultados`;
  $('#prod-tabla').innerHTML = `<div class="tablewrap"><table class="table"><thead><tr><th>PAS</th><th>Organización</th><th>Vinculante</th><th>Ejecutivo</th><th>Estado</th><th>Zona</th><th>Localidad</th><th>Pólizas vigentes</th><th></th></tr></thead><tbody>${pagina.map(p => `<tr><td class="link" data-pas="${esc(p.PAS)}">${esc(p.PAS)}</td><td>${esc(p.ORGANIZACIÓN)}</td><td>${esc(p.VINCULANTE)}</td><td>${esc(p.EJECUTIVO)}</td><td><span class="pill">${esc(p.ESTADO)}</span></td><td>${esc(p.ZONA)}</td><td>${esc(p['LOCALIDAD/PROV'])}</td><td>${fmt(p['CANTIDAD DE PÓLIZAS VIGENTES'])}</td><td>${puedeEliminarPas(p) ? `<button class="btn-del" data-eliminar-pas="${p._id}" data-nombre-pas="${esc(p.PAS)}" title="Eliminar PAS">×</button>` : ''}</td></tr>`).join('') || `<tr><td colspan="9"><div class="empty">Sin resultados</div></td></tr>`}</tbody></table></div><div class="pagbar" style="display:flex;align-items:center;gap:10px;justify-content:flex-end;padding:14px 4px 2px;font-size:12px;color:var(--muted)"><button class="back" id="pag-prev" ${state.pagina <= 1 ? 'disabled' : ''} style="${state.pagina <= 1 ? 'opacity:.5;cursor:default' : ''}">← Anterior</button><span>${state.pagina} de ${totalPaginas}</span><button class="back" id="pag-next" ${state.pagina >= totalPaginas ? 'disabled' : ''} style="${state.pagina >= totalPaginas ? 'opacity:.5;cursor:default' : ''}">Siguiente →</button><span style="display:flex;align-items:center;gap:5px;margin-left:8px"><span>Ir a:</span><input type="number" id="pag-input" min="1" max="${totalPaginas}" value="${state.pagina}" style="width:56px;padding:6px 7px"></span></div>`;

  document.querySelectorAll('[data-pas]').forEach(e => e.onclick = () => { state.pas = e.dataset.pas; state.view = 'ficha'; render() });
  document.querySelectorAll('[data-eliminar-pas]').forEach(btn => {
    btn.onclick = async () => {
      const nombre = btn.dataset.nombrePas;
      if (!confirm(`¿Eliminar el PAS "${nombre}"? Esta acción no se puede deshacer.`)) return;
      btn.disabled = true;
      const { error } = await supa.rpc('eliminar_pas', { p_pas_id: Number(btn.dataset.eliminarPas) });
      if (error) { alert(error.message); btn.disabled = false; return; }
      D = await cargarDatos();
      renderTablaProductores();
    };
  });
  const prevBtn = document.getElementById('pag-prev');
  const nextBtn = document.getElementById('pag-next');
  const pagInput = document.getElementById('pag-input');
  if (prevBtn) prevBtn.onclick = () => { if (state.pagina > 1) { state.pagina--; renderTablaProductores(); } };
  if (nextBtn) nextBtn.onclick = () => { if (state.pagina < totalPaginas) { state.pagina++; renderTablaProductores(); } };
  if (pagInput) {
    const irAPagina = () => {
      let n = parseInt(pagInput.value, 10);
      if (isNaN(n)) return;
      if (n < 1) n = 1;
      if (n > totalPaginas) n = totalPaginas;
      state.pagina = n;
      renderTablaProductores();
    };
    pagInput.onkeydown = e => { if (e.key === 'Enter') irAPagina(); };
    pagInput.onblur = irAPagina;
  }
}

let fichaTrimPas = null;

function ficha(pas) {
  const p = D.producers.find(x => x.PAS === pas);
  if (!p) { state.view = 'productores'; return render() }

  if (fichaTrimPas !== pas) {
    state.trimFicha = 'TODOS';
    state.chartCompania = null;
    state.chartRamo = null;
    state.chartEvo = 'TOTAL';
    fichaTrimPas = pas;
  }

  const rowsCompletas = D.production.filter(x => x.PAS === pas);
  const trimestresDelPas = [...new Set(rowsCompletas.map(x => x.TRIMESTRE))].sort((a, b) => trimestreOrden(b) - trimestreOrden(a));
  const rows = state.trimFicha === 'TODOS' ? rowsCompletas : rowsCompletas.filter(x => x.TRIMESTRE === state.trimFicha);

  const total = rows.reduce((s, x) => s + x.TOTAL, 0);
  const comp = {}, ramo = {}, trim = {};
  rows.forEach(x => { Object.entries(x.COMPANIAS).forEach(([c, v]) => comp[c] = (comp[c] || 0) + v); ramo[x.RAMO] = (ramo[x.RAMO] || 0) + x.TOTAL; });
  rowsCompletas.forEach(x => { trim[x.TRIMESTRE] = (trim[x.TRIMESTRE] || 0) + x.TOTAL; });
  const comps = Object.entries(comp).sort((a, b) => b[1] - a[1]); const ramos = Object.entries(ramo).sort((a, b) => b[1] - a[1]); const hist = Object.entries(trim).sort((a, b) => trimestreOrden(a[0]) - trimestreOrden(b[0]));
  const puedeDatos = puedeEditarDatosPas(p);
  const puedeProd = puedeCargarProduccion(p);
  const botonesAccion = `${puedeDatos ? '<button class="btn-edit" id="btn-editar-pas">Editar datos</button>' : ''}${puedeProd ? '<button class="btn-primary" id="btn-cargar-prod">+ Cargar producción</button>' : ''}`;
  const selectorTrimestre = `<select class="select" id="fic-trim"><option value="TODOS" ${state.trimFicha === 'TODOS' ? 'selected' : ''}>Todos los trimestres</option>${trimestresDelPas.map(t => `<option value="${esc(t)}" ${t === state.trimFicha ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>`;

  // Gráficos de tendencia: siempre sobre rowsCompletas (todo el histórico), sin importar el filtro de trimestre de arriba
  const trimestresAsc = [...trimestresDelPas].reverse();
  const compTotalCompleto = {}, ramoTotalCompleto = {};
  rowsCompletas.forEach(x => { Object.entries(x.COMPANIAS).forEach(([c, v]) => compTotalCompleto[c] = (compTotalCompleto[c] || 0) + v); ramoTotalCompleto[x.RAMO] = (ramoTotalCompleto[x.RAMO] || 0) + x.TOTAL; });
  const companiasDelPas = Object.entries(compTotalCompleto).sort((a, b) => b[1] - a[1]).map(([c]) => c);
  const ramosDelPas = Object.entries(ramoTotalCompleto).sort((a, b) => b[1] - a[1]).filter(([r]) => r).map(([r]) => r);
  if (!companiasDelPas.includes(state.chartCompania)) state.chartCompania = companiasDelPas[0] || null;
  if (!ramosDelPas.includes(state.chartRamo)) state.chartRamo = ramosDelPas[0] || null;

  const serieCompania = c => trimestresAsc.map(t => rowsCompletas.filter(x => x.TRIMESTRE === t).reduce((s, x) => s + (x.COMPANIAS[c] || 0), 0));
  const serieRamo = r => trimestresAsc.map(t => rowsCompletas.filter(x => x.TRIMESTRE === t && x.RAMO === r).reduce((s, x) => s + (x.TOTAL || 0), 0));
  // Producción de un ramo puntual, pero solo la parte que corresponde a una compañía puntual (para relacionar los dos gráficos)
  const serieRamoCompania = (r, c) => trimestresAsc.map(t => rowsCompletas.filter(x => x.TRIMESTRE === t && x.RAMO === r).reduce((s, x) => s + (x.COMPANIAS[c] || 0), 0));
  const serieTotal = () => trimestresAsc.map(t => rowsCompletas.filter(x => x.TRIMESTRE === t).reduce((s, x) => s + (x.TOTAL || 0), 0));

  const opcionesEvo = ['TOTAL', ...companiasDelPas.map(c => 'C:' + c), ...ramosDelPas.map(r => 'R:' + r)];
  const etiquetaEvo = v => v === 'TOTAL' ? 'Total' : v.startsWith('C:') ? 'Compañía: ' + v.slice(2) : 'Ramo: ' + v.slice(2);
  const datosEvo = state.chartEvo === 'TOTAL' ? serieTotal() : state.chartEvo.startsWith('C:') ? serieCompania(state.chartEvo.slice(2)) : state.chartEvo.startsWith('R:') ? serieRamo(state.chartEvo.slice(2)) : [];

  const selectCompania = `<select class="select" id="fic-chart-comp">${companiasDelPas.map(c => `<option value="${esc(c)}" ${c === state.chartCompania ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>`;
  const selectRamo = `<select class="select" id="fic-chart-ramo">${ramosDelPas.map(r => `<option value="${esc(r)}" ${r === state.chartRamo ? 'selected' : ''}>${esc(r)}</option>`).join('')}</select>`;
  const selectEvo = `<select class="select" id="fic-chart-evo">${opcionesEvo.map(v => `<option value="${esc(v)}" ${v === state.chartEvo ? 'selected' : ''}>${esc(etiquetaEvo(v))}</option>`).join('')}</select>`;

  const cardCompanias = companiasDelPas.length ? selectCompania + svgLineChart(trimestresAsc, serieCompania(state.chartCompania)) : '<div class="empty">Sin producción</div>';
  const ramoDatos = state.chartCompania ? serieRamoCompania(state.chartRamo, state.chartCompania) : serieRamo(state.chartRamo);
  const cardRamos = ramosDelPas.length ? selectRamo + svgLineChart(trimestresAsc, ramoDatos) : '<div class="empty">Sin producción</div>';
  const cardEvo = selectEvo + svgLineChart(trimestresAsc, datosEvo);

  // Compañías por ramo: matriz completa (todo el historial) para el gráfico de barras apiladas
  const ramoCompaniaMatrix = {};
  rowsCompletas.forEach(x => {
    if (!ramoCompaniaMatrix[x.RAMO]) ramoCompaniaMatrix[x.RAMO] = {};
    Object.entries(x.COMPANIAS).forEach(([c, v]) => { ramoCompaniaMatrix[x.RAMO][c] = (ramoCompaniaMatrix[x.RAMO][c] || 0) + v; });
  });
  const glosarioCompanias = companiasDelPas.map(c => `<div style="display:flex;align-items:center;gap:8px;margin:4px 0;font-size:12px"><span style="width:12px;height:12px;border-radius:3px;background:${colorParaCompania(c)};display:inline-block;flex:none"></span>${esc(c)}</div>`).join('') || '<div class="empty">Sin compañías</div>';
  const cardCompaniasPorRamo = `<div class="card section"><h3>Compañías por ramo</h3><div style="display:flex;gap:24px;flex-wrap:wrap"><div style="flex:2;min-width:320px">${svgBarrasRamoCompania(ramoCompaniaMatrix, ramosDelPas)}</div><div style="flex:1;min-width:160px">${glosarioCompanias}</div></div></div>`;

  $('#app').innerHTML = `<div class="top"><div><button class="back" id="back">← Productores</button><h1 style="margin-top:12px">${esc(p.PAS)}</h1><div class="sub">Ficha 360° del productor</div></div><div style="display:flex;gap:10px;align-items:center;align-self:flex-end">${selectorTrimestre}${botonesAccion}</div></div><div class="grid kpis"><div class="card kpi"><div class="label">Pólizas cargadas${state.trimFicha !== 'TODOS' ? ' (' + esc(state.trimFicha) + ')' : ''}</div><div class="num">${fmt(total)}</div></div><div class="card kpi"><div class="label">Compañías activas</div><div class="num">${fmt(comps.length)}</div></div><div class="card kpi"><div class="label">Ramos activos</div><div class="num">${fmt(ramos.length)}</div></div><div class="card kpi"><div class="label">Último trimestre cargado</div><div class="num" style="font-size:20px">${esc(hist.at(-1)?.[0] || '—')}</div></div></div><div class="grid two section"><div class="card"><h3>Datos del PAS</h3><div class="profile">${[['Organización', p.ORGANIZACIÓN], ['Vinculante', p.VINCULANTE], ['Ejecutivo', p.EJECUTIVO], ['Teléfono', p.TELÉFONO], ['Mail', p.MAIL], ['Estado', p.ESTADO], ['Zona', p.ZONA], ['Localidad / Prov.', p['LOCALIDAD/PROV']], ['Nacimiento', fmtFecha(p['FECHA DE NACIMIENTO'])], ['Observaciones', p.OBSERVACIONES]].map(([k, v]) => `<div class="field"><b>${esc(k)}</b>${esc(v || '—')}</div>`).join('')}<div class="field" style="grid-column:1/-1"><b>Compañías con las que opera</b>${esc(p['COMPAÑÍAS CON LAS QUE OPERA'] || '—')}</div></div></div><div class="card"><h3>Compañías con producción</h3>${cardCompanias}</div></div><div class="grid two section"><div class="card"><h3>Producción por ramo${state.chartCompania ? ' · ' + esc(state.chartCompania) : ''}</h3>${cardRamos}</div><div class="card"><h3>Evolución trimestral</h3>${cardEvo}</div></div>${cardCompaniasPorRamo}<div class="card section"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px"><h3 style="margin:0">Detalle de cargas${state.trimFicha !== 'TODOS' ? ' · ' + esc(state.trimFicha) : ''}</h3>${puedeProd && rowsCompletas.length ? `<button class="btn-secondary" id="btn-borrar-todo-prod">Borrar todo</button>` : ''}</div><div class="tablewrap"><table class="table"><thead><tr><th>Trimestre</th><th>Ramo</th><th>Total</th><th>Ejecutivo</th><th>Organizador</th>${puedeProd ? '<th></th>' : ''}</tr></thead><tbody>${rows.sort((a, b) => trimestreOrden(b.TRIMESTRE) - trimestreOrden(a.TRIMESTRE)).map(x => `<tr><td>${esc(x.TRIMESTRE)}</td><td>${esc(x.RAMO)}</td><td>${fmt(x.TOTAL)}</td><td>${esc(x.EJECUTIVO)}</td><td>${esc(x.ORGANIZADOR)}</td>${puedeProd ? `<td><button class="btn-edit" data-editar-prod="${x._id}" title="Editar carga">✎</button> <button class="btn-del" data-eliminar-prod="${x._id}" title="Eliminar carga">×</button></td>` : ''}</tr>`).join('') || `<tr><td colspan="${puedeProd ? 6 : 5}"><div class="empty">Sin cargas en este trimestre</div></td></tr>`}</tbody></table></div></div>`;
  $('#back').onclick = () => { state.view = 'productores'; state.pas = null; render() };
  $('#fic-trim').onchange = e => { state.trimFicha = e.target.value; render() };
  if (companiasDelPas.length) document.getElementById('fic-chart-comp').onchange = e => { state.chartCompania = e.target.value; render() };
  if (ramosDelPas.length) document.getElementById('fic-chart-ramo').onchange = e => { state.chartRamo = e.target.value; render() };
  document.getElementById('fic-chart-evo').onchange = e => { state.chartEvo = e.target.value; render() };
  if (puedeDatos) {
    document.getElementById('btn-editar-pas').onclick = () => abrirFormPAS(p);
  }
  if (puedeProd) {
    document.getElementById('btn-cargar-prod').onclick = () => abrirFormProduccion(p);
    document.querySelectorAll('[data-editar-prod]').forEach(btn => {
      btn.onclick = () => {
        const prod = rows.find(x => String(x._id) === btn.dataset.editarProd);
        if (prod) abrirFormEditarProduccion(prod);
      };
    });
    document.querySelectorAll('[data-eliminar-prod]').forEach(btn => {
      btn.onclick = async () => {
        const prod = rows.find(x => String(x._id) === btn.dataset.eliminarProd);
        if (!prod) return;
        if (!confirm(`¿Eliminar la carga de ${prod.RAMO} (${prod.TRIMESTRE})? Esta acción no se puede deshacer.`)) return;
        btn.disabled = true;
        const { error } = await supa.rpc('eliminar_produccion', { p_produccion_id: prod._id });
        if (error) { alert(error.message); btn.disabled = false; return; }
        D = await cargarDatos();
        render();
      };
    });
    const btnBorrarTodoProd = document.getElementById('btn-borrar-todo-prod');
    if (btnBorrarTodoProd) {
      btnBorrarTodoProd.onclick = async () => {
        if (!confirm(`¿Eliminar las ${rowsCompletas.length} cargas de ${p.PAS}? Es todo el historial de este PAS, sin importar el filtro de trimestre de arriba. Esta acción no se puede deshacer.`)) return;
        btnBorrarTodoProd.disabled = true;
        const { data, error } = await supa.rpc('eliminar_producciones_pas', { p_pas_id: p._id });
        btnBorrarTodoProd.disabled = false;
        if (error) { alert(error.message); return; }
        if (typeof data === 'number' && data < rowsCompletas.length) {
          alert(`Se borraron ${data} de ${rowsCompletas.length} cargas — las demás pertenecen a otra dupla y no tenías permiso para borrarlas.`);
        }
        D = await cargarDatos();
        render();
      };
    }
  }
}

const MAX_SELECCION_COMPARAR = 6;

function comparar() {
  // Al tildar un checkbox se re-renderiza toda la vista: guardamos scroll y texto buscado para no perderlos
  const listaAnterior = document.getElementById('cmp-lista');
  const scrollAnterior = listaAnterior ? listaAnterior.scrollTop : 0;
  const buscadorAnterior = document.getElementById('cmp-buscar');
  const textoBuscado = buscadorAnterior ? buscadorAnterior.value : '';

  const items = itemsParaDimension(state.cmpDim);
  const trimestresGlobal = [...new Set(D.production.map(x => x.TRIMESTRE))].sort((a, b) => trimestreOrden(a) - trimestreOrden(b));
  const dimActual = DIMENSIONES_COMPARAR.find(d => d.valor === state.cmpDim) || DIMENSIONES_COMPARAR[0];

  const selectDim = `<select class="select" id="cmp-dim">${DIMENSIONES_COMPARAR.map(d => `<option value="${d.valor}" ${d.valor === state.cmpDim ? 'selected' : ''}>${esc(d.etiqueta)}</option>`).join('')}</select>`;

  const checklistItems = items.map(it => {
    const marcado = state.cmpSel.includes(it);
    const deshabilitado = !marcado && state.cmpSel.length >= MAX_SELECCION_COMPARAR;
    return `<label data-nombre="${esc(it.toLowerCase())}"><input type="checkbox" value="${esc(it)}" ${marcado ? 'checked' : ''} ${deshabilitado ? 'disabled' : ''}>${esc(it)}</label>`;
  }).join('') || '<div class="sinresultados">No hay elementos para esta dimensión.</div>';

  const series = state.cmpSel.map(valor => ({ label: valor, valores: serieComparar(state.cmpDim, valor, trimestresGlobal) }));

  // Desglose: un solo selector (PAS/Ramos/Compañías/Organizaciones, se omite el que coincide con la dimensión elegida) aplicado a todos los elementos tildados
  const opcionesDesglose = TIPOS_DESGLOSE.filter(d => d.valor !== state.cmpDim);
  if (!opcionesDesglose.some(d => d.valor === state.cmpDesglose)) state.cmpDesglose = opcionesDesglose[0] ? opcionesDesglose[0].valor : null;
  const selectDesglose = `<select class="select" id="cmp-desglose-tipo">${opcionesDesglose.map(d => `<option value="${d.valor}" ${d.valor === state.cmpDesglose ? 'selected' : ''}>${esc(d.etiqueta)}</option>`).join('')}</select>`;
  const desglose = state.cmpSel.length ? `<div class="card section"><h3>Desglose</h3><div class="formgrid"><div class="full"><label>Ver ranking de</label>${selectDesglose}</div></div><div class="grid two section">${state.cmpSel.map(valor => bloqueRanking(valor, rankingParaTipo(state.cmpDesglose, filasParaDimension(state.cmpDim, valor)))).join('')}</div></div>` : '';

  $('#app').innerHTML = `<div class="top"><div><h1>Comparar</h1><div class="sub">Compará producción entre distintos elementos de la base</div></div></div><div class="grid two section"><div class="card"><h3>¿Qué querés comparar?</h3><div class="formgrid"><div class="full"><label>Dimensión</label>${selectDim}</div></div><div class="section"><label>Elegí hasta ${MAX_SELECCION_COMPARAR} — ${esc(dimActual.etiqueta.toLowerCase())}</label><input id="cmp-buscar" placeholder="Buscar..." value="${esc(textoBuscado)}"><div id="cmp-lista" class="checklist">${checklistItems}</div></div></div><div class="card"><h3>Evolución trimestral comparada</h3>${state.cmpSel.length ? svgMultiLineChart(trimestresGlobal, series) : '<div class="empty">Elegí al menos un elemento para comparar</div>'}</div></div>${desglose}`;

  document.getElementById('cmp-dim').onchange = e => { state.cmpDim = e.target.value; state.cmpSel = []; render(); };
  const selectorDesglose = document.getElementById('cmp-desglose-tipo');
  if (selectorDesglose) selectorDesglose.onchange = e => { state.cmpDesglose = e.target.value; render(); };
  document.querySelectorAll('#cmp-lista input[type=checkbox]').forEach(cb => {
    cb.onchange = () => {
      if (cb.checked) { if (!state.cmpSel.includes(cb.value)) state.cmpSel = [...state.cmpSel, cb.value]; }
      else { state.cmpSel = state.cmpSel.filter(v => v !== cb.value); }
      render();
    };
  });
  const filtrarLista = q => {
    const qq = q.trim().toLowerCase();
    document.querySelectorAll('#cmp-lista label').forEach(l => { l.style.display = l.dataset.nombre.includes(qq) ? 'flex' : 'none'; });
  };
  const buscador = document.getElementById('cmp-buscar');
  buscador.oninput = e => filtrarLista(e.target.value);
  if (textoBuscado) filtrarLista(textoBuscado);
  const listaNueva = document.getElementById('cmp-lista');
  if (listaNueva) listaNueva.scrollTop = scrollAnterior;
}

/* ============== REPORTES (solo admin): comentarios/bugs enviados por los usuarios ============== */
const ESTADOS_REPORTE = [
  { valor: 'pendiente', etiqueta: 'Pendiente' },
  { valor: 'en_revision', etiqueta: 'En revisión' },
  { valor: 'resuelto', etiqueta: 'Resuelto' },
];

async function cargarReportes() {
  const { data, error } = await fetchAllRows('reportes');
  reportesCache = error ? { error: error.message } : { rows: data || [] };
  render();
}

function vistaReportes() {
  if (perfil.rol !== 'admin') { state.view = 'dashboard'; return render(); }

  if (canalReportesAdmin === null) {
    vistaConSuscripcion = 'reportes';
    canalReportesAdmin = supa.channel('reportes-admin')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'reportes' }, () => cargarReportes())
      .subscribe();
  }

  if (reportesCache === null) {
    $('#app').innerHTML = `<div class="top"><div><h1>Reportes</h1><div class="sub">Comentarios y reportes enviados desde la app</div></div></div><div class="loading">Cargando reportes...</div>`;
    cargarReportes();
    return;
  }
  if (reportesCache.error) {
    $('#app').innerHTML = `<div class="top"><div><h1>Reportes</h1></div></div><div class="card"><div class="formerr">No se pudieron cargar los reportes: ${esc(reportesCache.error)}</div></div>`;
    return;
  }

  const filas = reportesCache.rows.slice().sort((a, b) => new Date(b.creado_en) - new Date(a.creado_en));
  const pendientes = filas.filter(r => (r.estado || 'pendiente') === 'pendiente').length;

  $('#app').innerHTML = `<div class="top"><div><h1>Reportes</h1><div class="sub">${fmt(filas.length)} recibidos · ${fmt(pendientes)} pendientes</div></div><button class="btn-secondary" id="btn-recargar-reportes">Recargar</button></div><div class="card"><div class="tablewrap"><table class="table"><thead><tr><th>Fecha</th><th>Usuario</th><th>Vista</th><th>Mensaje</th><th>Estado</th><th>Respuesta</th><th></th></tr></thead><tbody>${filas.map(r => {
    const resuelto = (r.estado || 'pendiente') === 'resuelto';
    return `<tr style="${resuelto ? 'color:var(--muted);background:#fafbfc' : ''}"><td>${esc(fmtFechaHora(r.creado_en))}</td><td>${esc(r.usuario_nombre || '—')}</td><td>${esc(r.vista || '—')}</td><td style="white-space:normal;max-width:380px">${esc(r.mensaje)}</td><td><select class="select" style="padding:5px 8px;font-size:11px" data-cambiar-estado="${r.id}">${ESTADOS_REPORTE.map(e => `<option value="${e.valor}" ${e.valor === (r.estado || 'pendiente') ? 'selected' : ''}>${esc(e.etiqueta)}</option>`).join('')}</select></td><td style="white-space:normal;max-width:220px">${r.respuesta ? `<div style="margin-bottom:4px">${esc(r.respuesta)}</div>` : ''}<button class="link" style="border:0;background:none;cursor:pointer;font-size:11px;padding:0" data-responder="${r.id}">${r.respuesta ? 'Editar respuesta' : 'Responder'}</button></td><td>${resuelto ? `<button class="btn-del" data-eliminar-reporte="${r.id}" title="Eliminar">×</button>` : ''}</td></tr>`;
  }).join('') || `<tr><td colspan="7"><div class="empty">No hay reportes todavía</div></td></tr>`}</tbody></table></div></div>`;

  document.getElementById('btn-recargar-reportes').onclick = () => { reportesCache = null; render(); };
  document.querySelectorAll('[data-eliminar-reporte]').forEach(btn => {
    btn.onclick = async () => {
      if (!confirm('¿Eliminar este reporte? Esta acción no se puede deshacer.')) return;
      const id = btn.dataset.eliminarReporte;
      btn.disabled = true;
      const { error } = await supa.from('reportes').delete().eq('id', id);
      if (error) { alert('No se pudo eliminar: ' + error.message); btn.disabled = false; return; }
      reportesCache.rows = reportesCache.rows.filter(r => String(r.id) !== id);
      render();
    };
  });
  document.querySelectorAll('[data-cambiar-estado]').forEach(sel => {
    sel.onchange = async () => {
      const id = sel.dataset.cambiarEstado;
      sel.disabled = true;
      const { error } = await supa.from('reportes').update({ estado: sel.value }).eq('id', id);
      sel.disabled = false;
      if (error) { alert('No se pudo actualizar: ' + error.message); return; }
      const row = reportesCache.rows.find(r => String(r.id) === id);
      if (row) row.estado = sel.value;
      render();
    };
  });
  document.querySelectorAll('[data-responder]').forEach(btn => {
    btn.onclick = () => {
      const r = reportesCache.rows.find(x => String(x.id) === btn.dataset.responder);
      if (r) abrirModalResponder(r);
    };
  });
}

function abrirModalResponder(r) {
  const html = `
    <h2>Responder reporte</h2>
    <div class="modal-sub">${esc(r.usuario_nombre || 'Usuario')} · ${esc(fmtFechaHora(r.creado_en))} · ${esc(r.vista || '—')}</div>
    <div class="field" style="margin-top:12px"><b>Mensaje original</b>${esc(r.mensaje)}</div>
    <div class="formgrid" style="margin-top:14px">
      <div class="full"><label>Tu respuesta</label><textarea id="f-respuesta" rows="4" placeholder="Escribí una respuesta...">${esc(r.respuesta || '')}</textarea></div>
    </div>
    <div id="form-respuesta-msg"></div>
    <div class="modal-actions">
      <button class="btn-secondary" id="btn-cancelar-respuesta">Cancelar</button>
      <button class="btn-primary" id="btn-guardar-respuesta">Guardar respuesta</button>
    </div>`;
  abrirModal(html);
  document.getElementById('btn-cancelar-respuesta').onclick = cerrarModal;
  document.getElementById('btn-guardar-respuesta').onclick = () => guardarRespuesta(r.id);
}

async function guardarRespuesta(id) {
  const btn = document.getElementById('btn-guardar-respuesta');
  const msg = document.getElementById('form-respuesta-msg');
  msg.innerHTML = '';
  const texto = document.getElementById('f-respuesta').value.trim();

  btn.disabled = true; btn.textContent = 'Guardando...';
  const { error } = await supa.from('reportes').update({ respuesta: texto || null }).eq('id', id);
  btn.disabled = false; btn.textContent = 'Guardar respuesta';
  if (error) {
    msg.innerHTML = `<div class="formerr">No se pudo guardar: ${esc(error.message)}</div>`;
    return;
  }
  const row = reportesCache.rows.find(r => String(r.id) === String(id));
  if (row) row.respuesta = texto;
  msg.innerHTML = '<div class="formok">Guardado.</div>';
  setTimeout(() => { cerrarModal(); render(); }, 500);
}

/* ============== MIS REPORTES: semáforo de mis propios reportes (para cualquier usuario) ============== */
const SEMAFORO_REPORTE = {
  pendiente: { color: '#C1613F', bg: '#F8ECE8', etiqueta: 'Reporte abierto' },
  en_revision: { color: '#d97706', bg: '#fffbeb', etiqueta: 'En revisión' },
  resuelto: { color: '#16a34a', bg: '#f0fdf4', etiqueta: 'Reporte cerrado' },
};
function pillSemaforo(estado) {
  const e = SEMAFORO_REPORTE[estado] || SEMAFORO_REPORTE.pendiente;
  return `<span style="display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:${e.bg};color:${e.color};font-size:11px;font-weight:700"><span style="width:8px;height:8px;border-radius:50%;background:${e.color};display:inline-block"></span>${esc(e.etiqueta)}</span>`;
}

async function cargarMisReportes() {
  const { data, error } = await fetchAllRows('reportes');
  misReportesCache = error ? { error: error.message } : { rows: (data || []).filter(r => r.usuario_id === perfil.id) };
  render();
}

function vistaMisReportes() {
  if (canalMisReportes === null) {
    vistaConSuscripcion = 'mis-reportes';
    canalMisReportes = supa.channel('reportes-mios')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'reportes', filter: `usuario_id=eq.${perfil.id}` }, () => cargarMisReportes())
      .subscribe();
  }

  if (misReportesCache === null) {
    $('#app').innerHTML = `<div class="top"><div><h1>Mis reportes</h1><div class="sub">Lo que reportaste y en qué estado está</div></div></div><div class="loading">Cargando...</div>`;
    cargarMisReportes();
    return;
  }
  if (misReportesCache.error) {
    $('#app').innerHTML = `<div class="top"><div><h1>Mis reportes</h1></div></div><div class="card"><div class="formerr">No se pudieron cargar: ${esc(misReportesCache.error)}</div></div>`;
    return;
  }

  const filas = misReportesCache.rows.slice().sort((a, b) => new Date(b.creado_en) - new Date(a.creado_en));

  $('#app').innerHTML = `<div class="top"><div><h1>Mis reportes</h1><div class="sub">${fmt(filas.length)} enviados</div></div><button class="btn-secondary" id="btn-recargar-mis-reportes">Recargar</button></div>${filas.map(r => `<div class="card section"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><span class="sub">${esc(fmtFechaHora(r.creado_en))} · ${esc(r.vista || '—')}</span>${pillSemaforo(r.estado || 'pendiente')}</div><p style="margin:10px 0 0">${esc(r.mensaje)}</p>${r.respuesta ? `<div style="margin-top:10px;padding:10px;background:#F0EDE6;border-radius:8px;font-size:13px"><b style="display:block;font-size:11px;color:var(--muted);margin-bottom:4px">Respuesta</b>${esc(r.respuesta)}</div>` : ''}</div>`).join('') || '<div class="card"><div class="empty">Todavía no mandaste ningún reporte</div></div>'}`;

  document.getElementById('btn-recargar-mis-reportes').onclick = () => { misReportesCache = null; render(); };
}

/* ============== USUARIOS (solo admin): crear cuentas nuevas vía Cloudflare Worker ============== */
const ROLES_USUARIO = [
  { valor: 'admin', etiqueta: 'Admin' },
  { valor: 'editor', etiqueta: 'Editor' },
  { valor: 'carga_pas', etiqueta: 'Carga solo PAS' },
  { valor: 'viewer', etiqueta: 'Observador' },
  { valor: 'jefe', etiqueta: 'Jefe' },
];
const necesitaDupla = rol => rol === 'editor' || rol === 'carga_pas';

function vistaUsuarios() {
  if (perfil.rol !== 'admin') { state.view = 'dashboard'; return render(); }

  $('#app').innerHTML = `<div class="top"><div><h1>Usuarios</h1><div class="sub">Crear cuentas nuevas para acceder a la app</div></div></div>
    <div class="card" style="max-width:520px">
      <h3>Nuevo usuario</h3>
      <div class="formgrid">
        <div class="full"><label>Nombre completo</label><input id="us-nombre" placeholder="Nombre y apellido"></div>
        <div class="full"><label>Email</label><input id="us-email" type="email" placeholder="usuario@abgestion.sistema"></div>
        <div class="full"><label>Contraseña temporal</label><input id="us-pass" type="text" placeholder="Mínimo 6 caracteres"></div>
        <div><label>Rol</label><select id="us-rol">${ROLES_USUARIO.map(r => `<option value="${r.valor}" ${r.valor === 'editor' ? 'selected' : ''}>${r.etiqueta}</option>`).join('')}</select></div>
        <div id="us-dupla-wrap"><label>Dupla asignada</label><select id="us-dupla"><option value="" disabled selected>Elegí una dupla</option>${[...D.catalog.ejecutivos].sort((a, b) => a.localeCompare(b, 'es')).map(e => `<option value="${esc(e)}">${esc(e)}</option>`).join('')}</select></div>
      </div>
      <div id="us-msg"></div>
      <div class="modal-actions" style="justify-content:flex-start">
        <button class="btn-primary" id="btn-crear-usuario">Crear usuario</button>
      </div>
    </div>
    <div class="section" id="usuarios-lista-wrap"></div>`;

  const actualizarDuplaVisible = () => {
    document.getElementById('us-dupla-wrap').style.display = necesitaDupla(document.getElementById('us-rol').value) ? 'block' : 'none';
  };
  document.getElementById('us-rol').onchange = actualizarDuplaVisible;
  actualizarDuplaVisible();

  document.getElementById('btn-crear-usuario').onclick = async () => {
    const btn = document.getElementById('btn-crear-usuario');
    const msg = document.getElementById('us-msg');
    msg.innerHTML = '';
    const nombre_completo = document.getElementById('us-nombre').value.trim();
    const email = document.getElementById('us-email').value.trim();
    const password = document.getElementById('us-pass').value;
    const rol = document.getElementById('us-rol').value;
    const dupla_asignada = document.getElementById('us-dupla').value;

    if (!nombre_completo || !email || !password) { msg.innerHTML = '<div class="formerr">Completá nombre, email y contraseña.</div>'; return; }
    if (necesitaDupla(rol) && !dupla_asignada) { msg.innerHTML = '<div class="formerr">Este rol necesita una dupla asignada.</div>'; return; }

    btn.disabled = true; btn.textContent = 'Creando...';
    const { data: { session } } = await supa.auth.getSession();
    try {
      const resp = await fetch(URL_CREAR_USUARIO, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
        body: JSON.stringify({ email, password, nombre_completo, rol, dupla_asignada }),
      });
      const result = await resp.json();
      btn.disabled = false; btn.textContent = 'Crear usuario';
      if (!resp.ok) { msg.innerHTML = `<div class="formerr">${esc(result.error || 'No se pudo crear el usuario')}</div>`; return; }
      msg.innerHTML = '<div class="formok">Usuario creado correctamente.</div>';
      document.getElementById('us-nombre').value = '';
      document.getElementById('us-email').value = '';
      document.getElementById('us-pass').value = '';
      document.getElementById('us-dupla').selectedIndex = 0;
      usuariosCache = null;
      renderListaUsuarios();
    } catch (err) {
      btn.disabled = false; btn.textContent = 'Crear usuario';
      msg.innerHTML = `<div class="formerr">Error de red: ${esc(err.message)}</div>`;
    }
  };

  renderListaUsuarios();
}

async function cargarUsuarios() {
  const { data, error } = await supa.from('usuarios').select('*').order('nombre_completo', { ascending: true });
  if (error) { usuariosCache = { error: error.message }; renderListaUsuarios(); return; }
  const filas = data || [];

  // La tabla "usuarios" no guarda el email real (vive en Supabase Auth) — lo traemos vía el Worker
  try {
    const { data: { session } } = await supa.auth.getSession();
    const resp = await fetch(URL_CREAR_USUARIO, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
      body: JSON.stringify({ action: 'listar_correos' }),
    });
    const result = await resp.json();
    if (resp.ok && Array.isArray(result.usuarios)) {
      const mapaEmails = Object.fromEntries(result.usuarios.map(u => [u.id, u.email]));
      filas.forEach(f => { f.email = mapaEmails[f.id] || ''; });
    }
  } catch (e) { /* si falla, seguimos sin emails precargados, no bloqueamos la lista */ }

  usuariosCache = { rows: filas };
  renderListaUsuarios();
}

function renderListaUsuarios() {
  const wrap = document.getElementById('usuarios-lista-wrap');
  if (!wrap) return;

  if (usuariosCache === null) {
    wrap.innerHTML = `<div class="card"><h3>Usuarios existentes</h3><div class="empty">Cargando...</div></div>`;
    cargarUsuarios();
    return;
  }
  if (usuariosCache.error) {
    wrap.innerHTML = `<div class="card"><h3>Usuarios existentes</h3><div class="formerr">No se pudieron cargar: ${esc(usuariosCache.error)}</div></div>`;
    return;
  }

  const filas = usuariosCache.rows;
  wrap.innerHTML = `<div class="card"><h3>Usuarios existentes</h3><div class="tablewrap"><table class="table"><thead><tr><th>Nombre</th><th>Rol</th><th>Dupla</th><th></th></tr></thead><tbody>${filas.map(u => `<tr><td>${esc(u.nombre_completo || '—')}</td><td><span class="pill">${esc((ROLES_USUARIO.find(r => r.valor === u.rol) || {}).etiqueta || u.rol || '')}</span></td><td>${esc(u.dupla_asignada || '—')}</td><td><button class="btn-edit" data-editar-usuario="${u.id}">Editar</button>${u.id !== perfil.id ? ` <button class="btn-del" data-eliminar-usuario="${u.id}" data-nombre-usuario="${esc(u.nombre_completo || '')}" title="Eliminar usuario">×</button>` : ''}</td></tr>`).join('') || `<tr><td colspan="4"><div class="empty">No hay usuarios</div></td></tr>`}</tbody></table></div></div>`;

  document.querySelectorAll('[data-editar-usuario]').forEach(btn => {
    btn.onclick = () => {
      const u = usuariosCache.rows.find(x => String(x.id) === btn.dataset.editarUsuario);
      if (u) abrirModalEditarUsuario(u);
    };
  });
  document.querySelectorAll('[data-eliminar-usuario]').forEach(btn => {
    btn.onclick = async () => {
      const nombre = btn.dataset.nombreUsuario;
      if (!confirm(`¿Eliminar al usuario "${nombre}"? Esta acción no se puede deshacer.`)) return;
      btn.disabled = true;
      const { data: { session } } = await supa.auth.getSession();
      try {
        const resp = await fetch(URL_CREAR_USUARIO, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
          body: JSON.stringify({ action: 'eliminar', id: btn.dataset.eliminarUsuario }),
        });
        const result = await resp.json();
        if (!resp.ok) { alert(result.error || 'No se pudo eliminar el usuario'); btn.disabled = false; return; }
        usuariosCache = null;
        renderListaUsuarios();
      } catch (err) {
        alert('Error de red: ' + err.message);
        btn.disabled = false;
      }
    };
  });
}

function abrirModalEditarUsuario(u) {
  const ejecutivosOrdenados = [...D.catalog.ejecutivos].sort((a, b) => a.localeCompare(b, 'es'));
  const html = `
    <h2>Editar usuario</h2>
    <div class="modal-sub">${esc(u.nombre_completo || '')}</div>
    <div class="formgrid">
      <div class="full"><label>Nombre completo</label><input id="eu-nombre" value="${esc(u.nombre_completo || '')}"></div>
      <div><label>Rol</label><select id="eu-rol">${ROLES_USUARIO.map(r => `<option value="${r.valor}" ${r.valor === u.rol ? 'selected' : ''}>${r.etiqueta}</option>`).join('')}</select></div>
      <div id="eu-dupla-wrap"><label>Dupla asignada</label><select id="eu-dupla">${ejecutivosOrdenados.map(e => `<option value="${esc(e)}" ${e === u.dupla_asignada ? 'selected' : ''}>${esc(e)}</option>`).join('')}</select></div>
      <div class="full"><label>Usuario/email</label><input id="eu-email" type="email" value="${esc(u.email || '')}"></div>
      <div class="full"><label>Nueva contraseña <span style="font-weight:400;color:var(--muted)">(dejar vacío para no cambiarla)</span></label><input id="eu-pass" type="text" placeholder="Mínimo 6 caracteres"></div>
    </div>
    <div id="eu-msg"></div>
    <div class="modal-actions">
      <button class="btn-secondary" id="btn-cancelar-eu">Cancelar</button>
      <button class="btn-primary" id="btn-guardar-eu">Guardar cambios</button>
    </div>`;
  abrirModal(html);

  const actualizarDuplaEu = () => {
    document.getElementById('eu-dupla-wrap').style.display = necesitaDupla(document.getElementById('eu-rol').value) ? 'block' : 'none';
  };
  document.getElementById('eu-rol').onchange = actualizarDuplaEu;
  actualizarDuplaEu();

  document.getElementById('btn-cancelar-eu').onclick = cerrarModal;
  document.getElementById('btn-guardar-eu').onclick = async () => {
    const btn = document.getElementById('btn-guardar-eu');
    const msg = document.getElementById('eu-msg');
    msg.innerHTML = '';
    const nombre_completo = document.getElementById('eu-nombre').value.trim();
    const rol = document.getElementById('eu-rol').value;
    const dupla_asignada = necesitaDupla(rol) ? document.getElementById('eu-dupla').value : null;
    const nuevoEmail = document.getElementById('eu-email').value.trim();
    const emailCambio = nuevoEmail && nuevoEmail !== (u.email || '');
    const nuevaPass = document.getElementById('eu-pass').value;

    if (!nombre_completo) { msg.innerHTML = '<div class="formerr">El nombre no puede quedar vacío.</div>'; return; }
    if (necesitaDupla(rol) && !dupla_asignada) { msg.innerHTML = '<div class="formerr">Este rol necesita una dupla asignada.</div>'; return; }
    if (!nuevoEmail) { msg.innerHTML = '<div class="formerr">El usuario/email no puede quedar vacío.</div>'; return; }
    if (nuevaPass && nuevaPass.length < 6) { msg.innerHTML = '<div class="formerr">La contraseña nueva tiene que tener al menos 6 caracteres.</div>'; return; }

    btn.disabled = true; btn.textContent = 'Guardando...';
    const { error } = await supa.from('usuarios').update({ nombre_completo, rol, dupla_asignada }).eq('id', u.id);
    if (error) {
      btn.disabled = false; btn.textContent = 'Guardar cambios';
      msg.innerHTML = `<div class="formerr">No se pudo guardar: ${esc(error.message)}</div>`;
      return;
    }

    if (emailCambio || nuevaPass) {
      const { data: { session } } = await supa.auth.getSession();
      try {
        const resp = await fetch(URL_CREAR_USUARIO, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
          body: JSON.stringify({ action: 'editar_credenciales', id: u.id, email: emailCambio ? nuevoEmail : undefined, password: nuevaPass || undefined }),
        });
        const result = await resp.json();
        if (!resp.ok) {
          btn.disabled = false; btn.textContent = 'Guardar cambios';
          msg.innerHTML = `<div class="formerr">Los datos se guardaron, pero no se pudo cambiar el usuario/contraseña: ${esc(result.error || '')}</div>`;
          return;
        }
      } catch (err) {
        btn.disabled = false; btn.textContent = 'Guardar cambios';
        msg.innerHTML = `<div class="formerr">Los datos se guardaron, pero falló la conexión al cambiar el usuario/contraseña: ${esc(err.message)}</div>`;
        return;
      }
    }

    btn.disabled = false; btn.textContent = 'Guardar cambios';
    msg.innerHTML = '<div class="formok">Guardado correctamente.</div>';
    usuariosCache = null;
    setTimeout(() => { cerrarModal(); cargarUsuarios(); }, 500);
  };
}

/* ============== PERFIL: estadísticas de la dupla del usuario (o de quien elija admin/jefe) ============== */
async function cargarPerfilesUsuarios() {
  const { data, error } = await supa.from('usuarios').select('*').order('nombre_completo', { ascending: true });
  perfilesCache = error ? { error: error.message } : { rows: (data || []).filter(u => u.dupla_asignada) };
  renderVistaPerfil();
}

function vistaPerfil() {
  const puedeVerOtros = perfil.rol === 'admin' || perfil.rol === 'jefe';
  if (puedeVerOtros && perfilesCache === null) {
    $('#app').innerHTML = `<div class="top"><div><h1>Perfil</h1></div></div><div class="loading">Cargando...</div>`;
    cargarPerfilesUsuarios();
    return;
  }
  renderVistaPerfil();
}

function renderVistaPerfil() {
  const puedeVerOtros = perfil.rol === 'admin' || perfil.rol === 'jefe';
  const tieneDupla = perfil.rol === 'editor' || perfil.rol === 'carga_pas';

  let duplaObjetivo = null;
  let nombreObjetivo = perfil.nombre_completo || '';
  let selectorHtml = '';

  if (puedeVerOtros) {
    if (perfilesCache && perfilesCache.error) {
      $('#app').innerHTML = `<div class="top"><div><h1>Perfil</h1></div></div><div class="card"><div class="formerr">No se pudieron cargar los usuarios: ${esc(perfilesCache.error)}</div></div>`;
      return;
    }
    const opciones = (perfilesCache && perfilesCache.rows) || [];
    if (!state.perfilObjetivoId && opciones.length) state.perfilObjetivoId = opciones[0].id;
    const elegido = opciones.find(u => u.id === state.perfilObjetivoId);
    duplaObjetivo = elegido ? elegido.dupla_asignada : null;
    nombreObjetivo = elegido ? elegido.nombre_completo : '';
    selectorHtml = `<div class="card section"><div class="formgrid"><div class="full"><label>Ver perfil de</label><select id="perfil-selector">${opciones.map(u => `<option value="${u.id}" ${u.id === state.perfilObjetivoId ? 'selected' : ''}>${esc(u.nombre_completo)} (${esc(u.dupla_asignada)})</option>`).join('') || '<option>No hay usuarios con dupla asignada</option>'}</select></div></div></div>`;
  } else if (tieneDupla) {
    duplaObjetivo = perfil.dupla_asignada;
  }

  const cuerpo = duplaObjetivo
    ? renderEstadisticasDupla(duplaObjetivo)
    : '<div class="card"><div class="empty">Este perfil no tiene una dupla asociada, no hay estadísticas de producción para mostrar.</div></div>';

  const crearDuplaHtml = perfil.rol === 'editor'
    ? `<div class="card section"><h3>Crear nueva dupla</h3><div class="formgrid"><div class="full"><label>Nombre de la dupla</label><input id="perfil-nueva-dupla" placeholder="Ej: PEREZ/GOMEZ"></div></div><div id="perfil-dupla-msg"></div><div class="modal-actions" style="justify-content:flex-start"><button class="btn-primary" id="btn-crear-dupla">Crear dupla</button></div></div>`
    : '';

  $('#app').innerHTML = `<div class="top"><div><h1>Perfil</h1><div class="sub">${esc(nombreObjetivo)}${duplaObjetivo ? ' · ' + esc(duplaObjetivo) : ''}</div></div></div>${selectorHtml}${cuerpo}${crearDuplaHtml}`;

  if (puedeVerOtros) {
    const sel = document.getElementById('perfil-selector');
    if (sel) sel.onchange = e => { state.perfilObjetivoId = e.target.value; renderVistaPerfil(); };
  }
  document.querySelectorAll('[data-pas]').forEach(e => e.onclick = () => { state.pas = e.dataset.pas; state.view = 'ficha'; render(); });

  if (perfil.rol === 'editor') {
    document.getElementById('btn-crear-dupla').onclick = async () => {
      const btn = document.getElementById('btn-crear-dupla');
      const msg = document.getElementById('perfil-dupla-msg');
      msg.innerHTML = '';
      const nombre = document.getElementById('perfil-nueva-dupla').value.trim();
      if (!nombre) { msg.innerHTML = '<div class="formerr">Escribí un nombre para la dupla.</div>'; return; }
      if (D.catalog.ejecutivos.includes(nombre)) { msg.innerHTML = '<div class="formerr">Ya existe una dupla con ese nombre.</div>'; return; }

      btn.disabled = true; btn.textContent = 'Creando...';
      const { error } = await supa.from('catalogos').insert({ tipo: 'ejecutivo', valor: nombre, activo: true });
      btn.disabled = false; btn.textContent = 'Crear dupla';
      if (error) { msg.innerHTML = `<div class="formerr">No se pudo crear: ${esc(error.message)}</div>`; return; }
      msg.innerHTML = '<div class="formok">Dupla creada correctamente.</div>';
      D = await cargarDatos();
      const input = document.getElementById('perfil-nueva-dupla');
      if (input) input.value = '';
    };
  }
}

function renderEstadisticasDupla(dupla) {
  const rows = D.production.filter(x => x.EJECUTIVO === dupla);
  const total = rows.reduce((s, x) => s + (x.TOTAL || 0), 0);
  const pasSet = new Set(rows.map(x => x.PAS));
  const ramo = {}, comp = {}, trim = {}, porPas = {};
  rows.forEach(x => {
    ramo[x.RAMO] = (ramo[x.RAMO] || 0) + x.TOTAL;
    Object.entries(x.COMPANIAS).forEach(([c, v]) => comp[c] = (comp[c] || 0) + v);
    trim[x.TRIMESTRE] = (trim[x.TRIMESTRE] || 0) + x.TOTAL;
    porPas[x.PAS] = (porPas[x.PAS] || 0) + x.TOTAL;
  });
  const topRamo = Object.entries(ramo).sort((a, b) => b[1] - a[1]).slice(0, 8);
  const topComp = Object.entries(comp).sort((a, b) => b[1] - a[1]).slice(0, 8);
  const topPas = Object.entries(porPas).sort((a, b) => b[1] - a[1]).slice(0, 8);
  const trimestresAsc = [...new Set(rows.map(x => x.TRIMESTRE))].sort((a, b) => trimestreOrden(a) - trimestreOrden(b));
  const serieTotal = trimestresAsc.map(t => rows.filter(x => x.TRIMESTRE === t).reduce((s, x) => s + (x.TOTAL || 0), 0));
  const max = a => Math.max(...a.map(x => x[1]), 1);

  return `<div class="grid kpis"><div class="card kpi"><div class="label">Pólizas cargadas</div><div class="num">${fmt(total)}</div></div><div class="card kpi"><div class="label">PAS a cargo</div><div class="num">${fmt(pasSet.size)}</div></div><div class="card kpi"><div class="label">Ramos activos</div><div class="num">${fmt(topRamo.length)}</div></div><div class="card kpi"><div class="label">Compañías activas</div><div class="num">${fmt(topComp.length)}</div></div></div><div class="grid two section"><div class="card"><h3>Top PAS</h3>${topPas.map(([k, v]) => `<div class="barrow"><span class="link" data-pas="${esc(k)}">${esc(k)}</span><div class="bar"><i style="width:${v / max(topPas) * 100}%"></i></div><b>${fmt(v)}</b></div>`).join('') || '<div class="empty">Sin producción</div>'}</div><div class="card"><h3>Evolución trimestral</h3>${svgLineChart(trimestresAsc, serieTotal)}</div></div><div class="grid two section"><div class="card"><h3>Producción por ramo</h3>${topRamo.map(([k, v]) => `<div class="barrow"><span>${esc(k)}</span><div class="bar"><i style="width:${v / max(topRamo) * 100}%"></i></div><b>${fmt(v)}</b></div>`).join('') || '<div class="empty">Sin datos</div>'}</div><div class="card"><h3>Top compañías</h3>${topComp.map(([k, v]) => `<div class="barrow"><span>${esc(k)}</span><div class="bar"><i style="width:${v / max(topComp) * 100}%"></i></div><b>${fmt(v)}</b></div>`).join('') || '<div class="empty">Sin datos</div>'}</div></div>`;
}

/* ============== PUNTO DE ENTRADA ============== */
(async function main() {
  renderLoading('Iniciando...');
  const { data: { session } } = await supa.auth.getSession();
  if (session) {
    await iniciarApp();
  } else {
    renderLogin();
  }
})();
</script>
